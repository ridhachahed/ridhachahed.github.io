<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="author" content="{{ site.title }}">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
  <canvas id="bg-art" aria-hidden="true"></canvas>
  <div class="bg-grad" aria-hidden="true"></div>

  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-name" href="/">~/ridha-chahed</a>
      <div class="nav-links">
        <a href="/#work">work</a>
        <a href="/#projects">projects</a>
        <a href="https://github.com/ridhachahed">github</a>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <article class="post reveal">
      <h1>{{ page.title }}</h1>
      <div class="post-meta">
        {{ page.date | date: "%B %-d, %Y" }}{% if page.venue %} · {{ page.venue }}{% endif %}{% if page.course %} · {{ page.course }}{% endif %}
      </div>
      {{ content }}
      <a class="back-link" href="/">← back home</a>
    </article>

    <footer class="foot">
      <span>© {{ site.time | date: "%Y" }} Ridha Chahed</span>
      <span>Built with Jekyll · Zurich</span>
    </footer>
  </main>

  <script src="{{ site.baseurl }}/assets/site.js"></script>
</body>
</html>
