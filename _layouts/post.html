---
layout: base
---

<article class="post reveal">
  <h1>{{ page.title }}</h1>
  <div class="post-meta">
    {{ page.date | date: "%B %-d, %Y" }}{% if page.venue %} · {{ page.venue }}{% endif %}{% if page.course %} · {{ page.course }}{% endif %}
  </div>
  {{ content }}
  <a class="back-link" href="/">← back to terminal</a>
</article>
