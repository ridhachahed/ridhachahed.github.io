<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — Senior MTS @ Oracle{% endif %}</title>
  <meta name="author" content="{{ site.title }}">
  <meta name="description" content="Ridha Chahed — Senior Member of Technical Staff at Oracle, building Generative AI and LLM systems in MySQL HeatWave.">

  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="Senior Member of Technical Staff at Oracle — Generative AI & LLMs.">
  <meta property="og:type" content="website">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
  <canvas id="bg-art" aria-hidden="true"></canvas>
  <div class="bg-grad" aria-hidden="true"></div>

  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-name" href="/">~/ridha-chahed</a>
      <div class="nav-links">
        <a href="/"{% if page.url == "/" %} class="active"{% endif %}>home</a>
        <a href="/work/"{% if page.url contains "/work" %} class="active"{% endif %}>work</a>
        <a href="/cv/"{% if page.url contains "/cv" %} class="active"{% endif %}>cv</a>
        <a href="/projects/"{% if page.url contains "/projects" %} class="active"{% endif %}>projects</a>
        <a href="/conferences/"{% if page.url contains "/conferences" %} class="active"{% endif %}>conferences</a>
      </div>
    </div>
  </nav>

  <main class="wrap">

    {{ content }}

    <footer class="foot">
      <span>© {{ site.time | date: "%Y" }} Ridha Chahed</span>
      <span>Built with Jekyll · Zurich</span>
    </footer>

  </main>

  <script src="{{ site.baseurl }}/assets/site.js"></script>
</body>
</html>
